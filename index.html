<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑铸基 · 逻辑就业顾问</title>
<style>
  :root{
    --brand:#5b63b3; --brand-soft:#eef0f9; --bg:#f4f5fa; --card:#ffffff;
    --text:#23262f; --muted:#8a8f9c; --line:#e6e8f0; --ok:#0fbf7a; --bad:#f25555; --warn:#f2a000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:860px;display:flex;flex-direction:column;height:100vh;background:var(--card);box-shadow:0 0 40px rgba(60,70,160,.08)}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f6f7ff,#fff)}
  .logo{width:42px;height:42px;border-radius:12px;flex-shrink:0;overflow:hidden;background:#fff}
  .logo img{width:100%;height:100%;object-fit:contain}
  header h1{font-size:16px}
  header .sub{font-size:12px;color:var(--muted)}
  #aiState{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef0f6;color:var(--muted)}
  #aiState.on{background:#e3f8ef;color:var(--ok)}
  header .spacer{flex:1}
  #restartBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer}
  #restartBtn:hover{color:var(--brand);border-color:var(--brand)}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.user{flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
  .avatar img{width:100%;height:100%;object-fit:contain}
  .row.user .avatar{background:#e2e4ee;color:#8a8f9c;font-size:13px}
  .bubble{max-width:78%;padding:12px 16px;border-radius:4px 16px 16px 16px;background:var(--brand-soft);line-height:1.75;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .row.user .bubble{background:var(--brand);color:#fff;border-radius:16px 4px 16px 16px}
  .bubble.plain{background:#fff;border:1px solid var(--line)}
  .bubble b{color:var(--brand)}
  .row.user .bubble b{color:#fff}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--brand);color:#fff;margin-right:6px;vertical-align:1px}
  .tag.dim{background:#7a5bff}
  .tag.ok{background:var(--ok)} .tag.bad{background:var(--bad)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:86%;line-height:1.8;font-size:14px}
  .card h3{font-size:14px;color:var(--brand);margin:10px 0 4px}
  .card h3:first-child{margin-top:0}
  .card .hr{border-top:1px dashed var(--line);margin:10px 0}
  .bar{height:8px;background:#eef0f6;border-radius:6px;overflow:hidden;margin:4px 0 8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#8a5bff);border-radius:6px;transition:width .8s}
  .pct{float:right;color:var(--muted);font-size:12px}
  .best{background:linear-gradient(90deg,#fff7e8,#fff);border:1px solid #ffe1a6;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:13px}
  #progress{display:none;padding:8px 20px;border-top:1px solid var(--line);background:#fafbff;font-size:12px;color:var(--muted)}
  #progress .track{height:6px;background:#e8eaf4;border-radius:4px;margin-top:6px;overflow:hidden}
  #progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#8a5bff);transition:width .4s;border-radius:4px}
  footer{border-top:1px solid var(--line);padding:12px 20px 16px;background:#fff}
  #quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{background:var(--brand);color:#fff}
  .chip.opt{display:block;width:100%;text-align:left;border-radius:10px;padding:9px 14px;margin:0}
  .chip.opt:hover{background:var(--brand-soft);color:var(--brand)}
  #quick .optwrap{width:100%;display:flex;flex-direction:column;gap:8px}
  .inputrow{display:flex;gap:10px}
  #inp{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;outline:none}
  #inp:focus{border-color:var(--brand)}
  #send{border:none;background:var(--brand);color:#fff;border-radius:12px;padding:0 22px;font-size:14px;cursor:pointer}
  #send:disabled{background:#c9cce8;cursor:default}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--brand);opacity:.4;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .jsonblock{background:#1e2233;color:#c9d4ff;border-radius:10px;padding:12px 14px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin-top:8px}
  .small{font-size:12px;color:var(--muted)}
</style>
</head>

const API_CONFIG = {
  baseURL: "",   /* 直连模式才填（以 /v1 结尾） */
  apiKey:  "",   /* 直连模式才填；Worker 模式留空 */

/* 启动时检查配置：直连 / Worker 代理 / 本地代理 */
async function initLLM(){
  const st = document.getElementById("aiState");
  const c = API_CONFIG;
  if(!c.model){ st.textContent = "未配置模型 · 本地模式"; return; }
  const direct = !!(c.baseURL && c.apiKey);
  const proxy = !direct && !!c.proxyURL;
  if(!direct && !proxy){ st.textContent = "未配置 API · 本地模式"; return; }
  if(proxy && !/^https?:/i.test(c.proxyURL) && !location.protocol.startsWith("http")){
    st.textContent = "请先运行 启动服务.bat · 本地模式";
    st.title = "代理模式需通过服务访问：双击 启动服务.bat 后打开 http://localhost:8787";
    return;
  }
  MODEL_ID = c.model; LLM_OK = true;
  st.textContent = "AI 已连接：" + c.model + (direct ? "（外部API）" : "（Worker代理 · 密钥已隐藏）");
  st.className = "on";
}

/* 统一的大模型调用：OpenAI 兼容 /chat/completions 流式接口 + SSE 解析 */
async function llmCall(system, user, jsonMode, onDelta){
  if(!LLM_OK) throw new Error("llm_offline");
  let out = "";
  const body = {
    model: API_CONFIG.model,
    messages: [ {role:"system", content:system}, {role:"user", content:user} ],
    stream: true,
    temperature: 0.4
  };
  if(jsonMode) body.response_format = {type:"json_object"};
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 90000);
  const direct = !!(API_CONFIG.baseURL && API_CONFIG.apiKey);
  const url = (direct
    ? API_CONFIG.baseURL.replace(/\/+$/,"")
    : API_CONFIG.proxyURL.replace(/\/+$/,"")) + "/chat/completions";
  const headers = { "Content-Type":"application/json" };
  if(API_CONFIG.apiKey) headers["Authorization"] = "Bearer " + API_CONFIG.apiKey;
  let resp;
  try{
    resp = await fetch(url, {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body),
      signal: ctl.signal
    });
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name==="AbortError" ? "请求超时（90秒）" : "无法连接 API（请检查网络、地址是否正确，以及服务商是否支持浏览器跨域 CORS）");
  }
  if(!resp.ok){
    clearTimeout(timer);
    let msg = ""; try{ msg = (await resp.text()).slice(0,200); }catch(e){}
    throw new Error("API 返回错误 " + resp.status + (msg ? "：" + msg : ""));
  }
  /* 解析 SSE 流 */
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  try{
    while(true){
      const r = await reader.read();
      if(r.done) break;
      buf += dec.decode(r.value, {stream:true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith("data:")) continue;
        const data = s.slice(5).trim();
        if(data === "[DONE]") continue;
        try{
          const j = JSON.parse(data);
          const d = j.choices && j.choices[0] && j.choices[0].delta;
          if(d && d.content){ out += d.content; if(onDelta) onDelta(d.content); }
        }catch(e){ /* 跳过不完整帧 */ }
      }
    }
  } finally { clearTimeout(timer); }
  if(!out.trim()) throw new Error("empty");
  return out;
}
function parseJSONLoose(t){
  t = t.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

/* ================= UI 基础 ================= */
const chat=document.getElementById("chat"),inp=document.getElementById("inp"),send=document.getElementById("send"),quick=document.getElementById("quick"),prog=document.getElementById("progress");

function scrollBottom(){chat.scrollTop=chat.scrollHeight;}
function addMsg(role,html,plain){
  const row=document.createElement("div");row.className="row "+role;
  const av=document.createElement("div");av.className="avatar";
  if(role==="bot"){const im=document.createElement("img");im.src=ICON_SRC;av.appendChild(im);}
  else{av.textContent="我";}
  const b=document.createElement("div");b.className="bubble"+(plain?" plain":"");b.innerHTML=html;
  row.appendChild(av);row.appendChild(b);chat.appendChild(row);scrollBottom();return b;
}
function botSay(html,plain,delay){return new Promise(res=>{const t=addMsg("bot",'<span class="typing"><i></i><i></i><i></i></span>',plain);scrollBottom();setTimeout(()=>{t.innerHTML=html;scrollBottom();res();},delay==null?400+Math.random()*350:delay);});}
function botStream(){
  const b=addMsg("bot","<span class='typing'><i></i><i></i><i></i></span>",true);
  return {
    push(t){ const tp=b.querySelector(".typing"); if(tp)tp.remove(); b.textContent+=t; scrollBottom(); }
  };
}
function userSay(html){addMsg("user",html,false);}
function setQuick(items,onPick){quick.innerHTML="";if(!items)return;const w=document.createElement("div");w.className="optwrap";items.forEach(it=>{const c=document.createElement("button");c.className="chip"+(it.opt?" opt":"");c.textContent=it.label;c.onclick=()=>{setQuick(null);onPick(it);};w.appendChild(c);});quick.appendChild(w);}

/* ================= 大模型环节 ================= */
/* 1) 信息抽取：从一句话里解析年级/专业/就业意向 */
async function llmExtract(text){
  const raw=await llmCall(
    SYS_BASE+" 从用户消息中抽取三个字段，严格JSON输出，未提及的字段填空字符串：{\"年级\":\"\",\"专业\":\"\",\"就业意向\":\"\"}。年级指在读年级（如大一/大二/研一等）；专业指所学专业名称；就业意向指目标岗位或领域。",
    text, true);
  return parseJSONLoose(raw);
}
/* 2) 情景题生成 */
async function llmGenScenario(){
  const sys=SYS_BASE+" 你是情景测试出题官，擅长设计与专业、就业方向强相关的职场情景题。";
  const userMsg="被测者信息——专业："+S.major+"；目标就业方向："+S.target+"。请为其生成一道求职情景测试题：模拟一个该方向真实职场沟通/汇报场景，题目需包含具体情景描述和明确的作答要求（如说明问题、原因分析、建议等要素），要求被测者用150字以上连贯作答。只输出题目本身，不要多余解释，不要分点标记答案。";
  return await llmCall(sys, userMsg, false);
}
/* 3) 语言表达评分（测评考官） */
async function llmScoreLang(answer,sceneText){
  const userMsg="【测试情景】\n"+sceneText+"\n\n【被测者回答】\n"+answer;
  const raw=await llmCall(PROMPT_LANG_EXAMINER,userMsg,true);
  const j=parseJSONLoose(raw);
  return {acc:num(j["表达准确性得分"]),logicPts:num(j["逻辑条理性得分"]),comp:num(j["信息完整度得分"]),flu:num(j["语言通顺度得分"]),total:num(j["总分"]),grade:j["等级"],cm:j["简短评语"]||""};
}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
/* 4) 自我认知就业影响评价（供最终报告输入） */
async function llmSelfEval(){
  const picked=SELF_QS.map((q,i)=>q.t+"：选"+SELF_LETTER[S.selfAns[i]]+"（"+q.opts[S.selfAns[i]]+"）").join("\n");
  const userMsg="被测者完成了自我认知五题测试，选择如下：\n"+picked+"\n\n请从职业心理角度，用120字以内客观评价其自我认知水平，以及这些特点对其就业的影响（积极或风险），直接输出评价文字，不要分点、不要客套。";
  return await llmCall(SYS_BASE+" 你是职业心理测评分析师。",userMsg,false);
}

async function boot(){
  setQuick(null);setInputEnabled(false);setProgress(null);

  await botSay("小提示：也可以一句话直接介绍，例如\u201c我大三，计算机专业，想做互联网产品\u201d，AI 会自动识别你的信息。");
  askGrade();
}

  S.step="confirm";setInputEnabled(false);

async function startTest(){
  S.step="test";
  S.order=DIM_ORDER.flatMap(d=>BANK.filter(q=>q.dim===d).sort(()=>Math.random()-.5));
  await botSay("信息确认完毕，正式进入 <b>第一流程：逻辑能力测试</b>。\n共 <b>20 题</b>，四个维度（逻辑推理 / 因果分析 / 辩论思辨 / 批判性思维）各 5 题，逐题作答，每题 2 分。\n请直接回复选项字母（A / B / C / D），也可以点击选项按钮。",false,400);
  nextQ();
}
async function nextQ(){
  if(S.qIdx>=20){return testSummary();}
  const q=S.order[S.qIdx],dim=DIMS[q.dim].name,qn=S.qIdx+1;
  setProgress("第一流程 · 逻辑能力测试　第 "+qn+"/20 题（维度："+dim+"）",qn/20*100);
  await botSay('<span class="tag">第 '+qn+' 题</span><span class="tag dim">维度：'+dim+'</span>\n'+esc(q.q)+'\n\n<b>A.</b> '+esc(q.opts[0])+'\n<b>B.</b> '+esc(q.opts[1])+'\n<b>C.</b> '+esc(q.opts[2])+'\n<b>D.</b> '+esc(q.opts[3]),true,350);
  setQuick([{label:"A. "+q.opts[0],opt:true,v:"A"},{label:"B. "+q.opts[1],opt:true,v:"B"},{label:"C. "+q.opts[2],opt:true,v:"C"},{label:"D. "+q.opts[3],opt:true,v:"D"}],it=>{userSay(it.v+". "+esc(q.opts["ABCD".indexOf(it.v)]));answerQ(it.v);});
  S.step="test";setInputEnabled(true);
}
async function answerQ(letter){
  const q=S.order[S.qIdx];
  letter=(letter||"").trim().toUpperCase().replace(/[^ABCD]/g,"").slice(-1)||"";
  if(!"ABCD".includes(letter)){await botSay("请回复选项字母 <b>A / B / C / D</b> 哦～");setInputEnabled(true);return;}
  setQuick(null);setInputEnabled(false);
  const right=letter===q.ans;
  if(right){S.dimScore[q.dim]+=2;S.dimRight[q.dim]++;}
  await botSay(right?'<span class="tag ok">✔ 回答正确</span> +2 分':'<span class="tag bad">✘ 回答错误</span>　正确答案：<b>'+q.ans+". "+esc(q.opts["ABCD".indexOf(q.ans)])+'</b>',false,350);
  S.qIdx++;setTimeout(nextQ,250);
}
async function testSummary(){
  setProgress("第一流程完成 · 正在汇总",100);
  const total=S.dimScore.logic+S.dimScore.causal+S.dimScore.debate+S.dimScore.critical;
  await botSay("逻辑能力测试完成！成绩汇总：\n逻辑推理 <b>"+S.dimScore.logic+"/10</b>（答对 "+S.dimRight.logic+"/5）\n因果分析 <b>"+S.dimScore.causal+"/10</b>（答对 "+S.dimRight.causal+"/5）\n辩论思辨 <b>"+S.dimScore.debate+"/10</b>（答对 "+S.dimRight.debate+"/5）\n批判性思维 <b>"+S.dimScore.critical+"/10</b>（答对 "+S.dimRight.critical+"/5）\n总体评分：<b>"+total+"/40</b>",false,500);
  scenarioIntro();
}
async function scenarioIntro(){
  S.step="scenarioWait";setInputEnabled(false);setProgress(null);
  await botSay("接下来是 <b>第二流程：情景问答</b>，请阅读题目并认真回答，本题旨在测试你的<b>语言表达和逻辑编排能力</b>。",false,400);
  /* 优先用大模型按专业+意向生成情景题 */
  let sceneText="",title="情景测试题";
  if(LLM_OK){
    setProgress("AI 正在根据你的专业与就业意向生成情景题…",0);
    try{ sceneText=(await llmGenScenario()).trim(); }catch(e){ sceneText=""; }
    setProgress(null);
  }
  if(!sceneText){const sc=pickScenario(S.target);S.scenario=sc;sceneText=sc.prompt;title=sc.title;}
  else{S.scenario={prompt:sceneText,groups:[],kw:[],llm:true};title="AI 定制情景题";}
  await botSay('<span class="tag">'+esc(title)+'</span>\n'+esc(sceneText),true,400);
  await botSay("请直接输入你的完整回答（建议 150 字以上，可分点表述）。AI 考官将从<b>表达准确性、逻辑条理性、信息完整度、语言通顺度</b>四个维度为你评分（满分 10 分）。");
  S.step="scenario";setInputEnabled(true);
}
async function handleScenario(text){
  if(text.replace(/\s/g,"").length<30){await botSay("回答有点短啦～为了保证测评效果，请展开作答（至少 30 字，建议 150 字以上）。");setInputEnabled(true);return;}
  setInputEnabled(false);S.step="scoring";
  let r=null;
  if(LLM_OK){
    setProgress("AI 考官正在评分…",0);
    try{ r=await llmScoreLang(text,S.scenario.prompt); }catch(e){ r=null; }
    setProgress(null);
  }
  if(!r){ r=scoreLangLocal(text,S.scenario); await botSay("<span class='small'>（AI 通道暂不可用，本次为本地规则评分）</span>",false,200); }
  S.langDetail=r;S.lang=r.total;
  await botSay("评分完成，以下是语言表达能力测评结果：\n"+'<div class="jsonblock">{\n  "表达准确性得分": "'+r.acc+' / 3",\n  "逻辑条理性得分": "'+r.logicPts+' / 3",\n  "信息完整度得分": "'+r.comp+' / 2",\n  "语言通顺度得分": "'+r.flu+' / 2",\n  "总分": "'+r.total+' / 10",\n  "等级": "'+esc(String(r.grade))+'",\n  "简短评语": "'+esc(String(r.cm))+'"\n}</div>',false,700);
  selfIntro();
}
/* 本地兜底评分引擎 */
function scoreLangLocal(text,sc){
  const len=text.replace(/\s/g,"").length;
  let acc=1,logicPts=0,comp=1,flu=2;
  if(sc.kw&&sc.kw.length){
    const kwHit=sc.kw.filter(k=>text.includes(k)).length/sc.kw.length;
    if(len>=60&&kwHit>=.3)acc=2;
    if(len>=150&&kwHit>=.6)acc=3;
    if(len<60)acc=len<25?0:1;
    if(len>700)acc=Math.max(0,acc-1);
    let hit=0;sc.groups.forEach(g=>{if(g.some(k=>text.includes(k)))hit++;});
    const cover=hit/sc.groups.length;
    comp=cover>=.75?2:cover>=.4?1:0;
  }else{ acc=len>=150?3:len>=60?2:1; comp=len>=150?2:len>=60?1:0; }
  const mk=(text.match(/首先|其次|再次|然后|最后|第一|第二|第三|第四|一方面|另一方面|因为|所以|因此|综上|一是|二是|三是/g)||[]).length;
  const paras=text.split(/\n+/).filter(x=>x.trim()).length;
  if(mk>=4)logicPts=3;else if(mk>=2)logicPts=2;else if(mk===1||paras>=3)logicPts=1;else logicPts=len>250?1:0;
  if(mk>=2&&paras>=2)logicPts=Math.min(3,logicPts+1);
  const sents=text.split(/[。！？!?；;\n]/).filter(x=>x.trim().length>1);
  const avg=sents.length?sents.reduce((a,b)=>a+b.length,0)/sents.length:len;
  const filler=(text.match(/嗯{2,}|那个那个|然后然后|就是说就是说/g)||[]).length;
  if(avg>75)flu=1;
  if(filler>0)flu=Math.max(0,flu-1);
  const total=Math.round((acc+logicPts+comp+flu)*10)/10;
  const grade=total>=8?"优秀":total>=6?"良好":total>=4?"合格":total>=2?"较差":"很差";
  const cm="优点："+(acc>=2?"表达基本贴合题意；":"信息传递有待聚焦；")+(logicPts>=2?"结构化表述清晰；":"层次感可加强；")+(comp>=2?"要素齐全。":"部分情景要素有缺项。")+"（本地规则评分，供参考）";
  return {acc,logicPts,comp,flu,total,grade,cm};
}

  S.step="selfIntro";S.selfIdx=0;S.selfScore=0;S.selfAns=[];

}

  const advice=[DIM_ADVICE[dimSorted[3]],DIM_ADVICE[dimSorted[2]],S.lang<6?"坚持结构化表达训练：先列\u201c观点—原因—方案—结论\u201d提纲再开口，每周录制一次3分钟模拟汇报并复盘。":"保持表达优势，面试中主动\u201c结论先行\u201d，准备2-3个可复用的结构化案例库。"];

/* ================= 输入分发 ================= */
async function handle(text){
  switch(S.step){
    case "grade":{
      setInputEnabled(false);
      /* 先尝试大模型一句话抽取（年级+专业+意向一起识别） */
      if(LLM_OK){
        let j=null;
        try{ j=await llmExtract(text); }catch(e){ j=null; }
        if(j){
          const g=(j["年级"]||"").trim(),mj=(j["专业"]||"").trim(),tj=(j["就业意向"]||"").trim();
          if(g&&mj&&tj){S.grade=g;S.major=mj;S.target=tj;await botSay("AI 已识别你的信息 ✅");return confirmInfo();}
          if(g){S.grade=g;await botSay("年级已识别：<b>"+esc(g)+"</b> ✅");if(!S.major)return askMajor();if(!S.target)return askTarget();return confirmInfo();}
        }
      }
      if(!validGrade(text)){await botSay("这个年级信息好像不太有效呢。请输入规范的在读年级，例如：<b>大一 / 大二 / 大三 / 大四 / 研一 / 研二 / 研三</b>。");setInputEnabled(true);return;}
      S.grade=text;await botSay("年级已记录 ✅");askMajor();break;
    }
    case "major":
      if(text.replace(/\s/g,"").length<2||text.length>30){await botSay("请输入有效的专业名称（2-30 字），例如：计算机科学与技术、护理学、法学。");setInputEnabled(true);return;}
      S.major=text;await botSay("专业已记录 ✅");askTarget();break;
    case "target":
      if(text.replace(/\s/g,"").length<2||text.length>30){await botSay("请输入有效的就业意向（2-30 字），例如：互联网产品、医疗护理、新媒体运营。");setInputEnabled(true);return;}
      S.target=text;await botSay("就业意向已记录 ✅");confirmInfo();break;
    case "test":answerQ(text);break;
    case "scenario":handleScenario(text);break;
    case "confirm":await botSay("请点击上方的确认按钮选择哦～");setInputEnabled(false);break;
    default:setInputEnabled(true);
  }
}
